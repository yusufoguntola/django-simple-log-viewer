[metadata]
name = django-simple-log-viewer
version = 2.0.0
description = A Django app to view project logs.
long_description = file: README.rst
long_description_content_type = text/x-rst
url = https://github.com/yusufoguntola/django-simple-log-viewer
author = Yusuf Oguntola
author_email = yusuf.oguntola@gmail.com
summary = View logs in your django application in a simple but intuitive way.
license = MIT License
classifiers =
    Environment :: Web Environment
    Framework :: Django
    Framework :: Django :: 4.2
    Framework :: Django :: 5.0
    Framework :: Django :: 5.1
    Framework :: Django :: 5.2
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Internet :: WWW/HTTP
    Topic :: Internet :: WWW/HTTP :: Dynamic Content

[options]
include_package_data = true
packages = find:
python_requires = >=3.11
install_requires =
    Django >= 4.2